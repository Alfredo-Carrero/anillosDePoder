<div class="tablaPersonajes">
  <div class="card flex justify-center">
    <button pButton routerLink="/crearPersonaje" (click)="crearPersonaje()">
      <i class="pi pi-check" pButtonIcon></i>
      <span pButtonLabel>Crear Personaje</span>
    </button>
  </div>

  <p-table [value]="personajes" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Raza</th>
        <th>Fecha Nacimiento</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr [ngClass]="{ 'fila-inactiva': item.fechaBaja !== null }">
        <td>{{ item.nombre }}</td>
        <td>{{ item.raza }}</td>
        <td>{{ item.fechaNacimiento }}</td>
        <td>
          <p-button icon="pi pi-pencil" severity="info" (onClick)="editar(item.id)">
            <img src="assets/img/editar.png" alt="Editar" />
          </p-button>

          @if (item.fechaBaja) {
            <p-button
              severity="primary"
              (onClick)="reactivarPersonaje($event, item.id)"
              pTooltip="Reactivar"
              tooltipPosition="top"
            >
              <img src="assets/img/reactivar.png" alt="Reactivar" />
            </p-button>
          } @else {
            <p-button
              severity="warn"
              (onClick)="darBajaLogica($event, item.id)"
              pTooltip="Baja Lógica"
              tooltipPosition="top"
            >
              <img src="assets/img/baja-logica.png" alt="Baja" />
            </p-button>
          }

          <p-button
            icon="pi pi-pencil"
            severity="danger"
            (onClick)="darBajaFisica($event, item.id)"
          >
            <img src="assets/img/baja-fisica.png" alt="Eliminar" />
          </p-button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No hay personajes disponibles.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-confirmar-popup></app-confirmar-popup>

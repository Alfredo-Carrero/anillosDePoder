<div class="container-form">
  <form [formGroup]="formulario">
    <label for="">Nombre: </label>
    <input type="text" pInputText formControlName="nombre" />

    <label for="">Raza: </label>
    <input type="text" pInputText formControlName="raza" />

    <label for="">Fecha Nacimiento: </label>
    <input type="date" formControlName="fechaNacimiento" />

    <label for="">Nivel corrupción: </label>
    <p-slider formControlName="nivelCorrupcion" />

    <button pButton (click)="guardar()">
      {{ route.snapshot.paramMap.get('id') ? 'Editar' : 'Crear' }}
    </button>
  </form>
</div>
